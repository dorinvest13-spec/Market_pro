<script type="text/plain" data-name="worker.js">
/* ============================================
   AI-PROXY v13.2 — единая AI-точка приложения
   1) Текст: Workers AI (Llama-4 → Mistral → Qwen3 → DeepSeek-R1)
             → OpenRouter free-пул (автоподбор + статический запас)
   2) Картинки: Flux → SDXL → Pollinations
   3) Защита: x-app-token / ?ping=
   ============================================ */
const OPENROUTER_KEY = '***REDACTED***'; // боевой ключ только в Cloudflare Worker
const APP_TOKEN      = 'market2026';
const SITE_REF       = 'https://dorinvest13-spec.github.io/';
const UA             = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
const SYSRU = 'Ты — профессиональный копирайтер. Отвечай только готовым текстом на русском, без комментариев.';

const WA_MODELS = [
  '@cf/meta/llama-4-scout-17b-16e-instruct',
  '@cf/mistralai/mistral-small-3.1-24b-instruct',
  '@cf/qwen/qwen3-30b-a3b-fp8',
  '@cf/deepseek-ai/deepseek-r1-distill-qwen-32b'
];
const WA_IMG = [
  '@cf/black-forest-labs/flux-1-schnell',
  '@cf/stabilityai/stable-diffusion-xl'
];
const OR_STATIC = [
  'liquid/lfm-2.5-2.6b:free',
  'deepseek/deepseek-chat:free',
  'qwen/qwen3-30b-a3b:free'
];

const H = {
  'content-type': 'application/json',
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': 'content-type,x-app-token',
  'Access-Control-Allow-Methods': 'POST,GET,OPTIONS'
};
const J = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: H });

let MCACHE = null, MCACHE_T = 0;
async function orModels() {
  if (MCACHE && Date.now() - MCACHE_T < 6 * 3600 * 1000 && MCACHE.length) return MCACHE;
  try {
    const r = await fetch('https://openrouter.ai/api/v1/models');
    if (r.ok) {
      const d = await r.json();
      const list = (d.data || []).filter(m => {
        const p = m.pricing || {};
        return String(p.prompt) === '0' && String(p.completion) === '0';
      }).map(m => m.id);
      const score = id => {
        const l = id.toLowerCase();
        let s = 9;
        if (l.includes('deepseek')) s = 0;
        else if (l.includes('qwen')) s = 1;
        else if (l.includes('llama')) s = 2;
        else if (l.includes('glm')) s = 3;
        else if (l.includes('mistral')) s = 4;
        else if (l.includes('gemma') && l.includes('it')) s = 5;
        else if (l.includes('gemini')) s = 6;
        else if (l.includes('cohere') || l.includes('command')) s = 7;
        else if (l.includes('phi')) s = 8;
        if (l.includes('code') || l.includes('coder')) s += 6;
        if (l.includes('lyria') || l.includes('audio') || l.includes('image') || l.includes('dots') || l.includes('note')) s += 9;
        if (l.includes('reasoning') || l.includes('think')) s += 3;
        return s;
      };
      list.sort((a, b) => score(a) - score(b) || a.localeCompare(b));
      if (list.length) { MCACHE = list.slice(0, 6); MCACHE_T = Date.now(); }
    }
  } catch (e) {}
  if (!MCACHE || !MCACHE.length) MCACHE = OR_STATIC.slice();
  return MCACHE;
}

let LAST_ERRS = [];

export default {
  async fetch(req, env) {
    if (req.method === 'OPTIONS') return new Response(null, { headers: H });
    const url = new URL(req.url);

    if (req.method === 'GET') {
      if (url.searchParams.get('ping') !== APP_TOKEN) return J({ error: '403 forbidden' }, 403);
      try {
        const r = await anyModel(env, 'Скажи одно слово: ОК', SYSRU, 0.3);
        return J({ ok: true, provider: r.model, sample: r.text.slice(0, 40), backend: r.backend, img: !!env.AI, wa_log: LAST_ERRS.slice(0, 4) });
      } catch (e) {
        return J({ ok: false, error: String(e.message || e), wa_log: LAST_ERRS.slice(0, 4) }, 502);
      }
    }

    if (req.headers.get('x-app-token') !== APP_TOKEN) return J({ error: '403 forbidden' }, 403);
    try {
      const b = await req.json();
      if (b.action === 'image') {
        const p = String(b.prompt || '').slice(0, 800);
        const r = await genImage(env, p);
        return J({ image: r.image, provider: r.provider });
      }
      const r = await anyModel(env, b.prompt, b.system || SYSRU, b.kind === 'creative' ? 0.9 : 0.5);
      return J({ text: r.text, provider: r.model, backend: r.backend });
    } catch (e) {
      return J({ error: String(e.message || e) }, 502);
    }
  }
};

async function genImage(env, prompt) {
  if (env.AI) {
    for (const m of WA_IMG) {
      try {
        const r = await env.AI.run(m, { prompt });
        if (r && r.image) return { image: 'data:image/png;base64,' + r.image, provider: m.replace('@cf/', '') };
      } catch (e) {}
    }
  }
  return {
    image: 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=1024&height=1024&nologo=true&seed=' + (Date.now() % 1000000),
    provider: 'pollinations-img'
  };
}

async function anyModel(env, prompt, system, temp) {
  const errs = [];
  if (env.AI) {
    for (const model of WA_MODELS) {
      try {
        const d = await env.AI.run(model, {
          messages: [
            { role: 'system', content: system },
            { role: 'user', content: prompt }
          ],
          temperature: temp,
          max_tokens: 2500
        });
        const raw = String(d?.response || d?.result || '');
        const t = raw.replace(/<\/?think>/gi, '').trim();
        if (!t) throw new Error('empty');
        LAST_ERRS = errs.slice();
        return { text: t, model: model.replace('@cf/', ''), backend: 'workers-ai' };
      } catch (e) {
        errs.push('WA:' + model.replace('@cf/', '') + '→' + (e.message || e));
      }
    }
  } else {
    errs.push('WA:биндинг AI не добавлен');
  }
  LAST_ERRS = errs.slice();

  const list = await orModels();
  for (const model of list) {
    try {
      const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + OPENROUTER_KEY,
          'User-Agent': UA,
          'HTTP-Referer': SITE_REF,
          'X-Title': 'ИИ-Маркетолог PRO'
        },
        body: JSON.stringify({
          model,
          temperature: temp,
          max_tokens: 2500,
          messages: [
            { role: 'system', content: system },
            { role: 'user', content: prompt }
          ]
        })
      });
      if (!r.ok) {
        const b = await r.text().catch(() => '');
        throw new Error('http ' + r.status + ' ' + b.slice(0, 60));
      }
      const d = await r.json();
      let t = d?.choices?.[0]?.message?.content || '';
      t = String(t).replace(/<\/?think>/gi, '').trim();
      if (!t) throw new Error('empty');
      return { text: t, model, backend: 'openrouter' };
    } catch (e) {
      errs.push('OR:' + model.split('/').pop() + '→' + e.message);
    }
  }
  throw new Error(errs.join(' | ').slice(0, 600));
}
</script>

<script type="text/plain" data-name="README.md">
# ИИ-Маркетолог PRO v9.7 — мобильный PWA-комплекс контент-маркетинга

## Назначение
Генерация продающих постов под 5 площадок (Telegram, Instagram, ВКонтакте, сайт, Яндекс Дзен)
+ сборка визуальных карточек товара (реальное фото клиента + AI-фон/ракурсы)
+ аналитика «Топ-10 товаров за неделю» + экспорт пакета к публикации (PNG/HTML/Web Share).

## Файлы
- index.html — всё приложение (разметка + стили + JS, один файл, без сборщиков и зависимостей)
- worker.js  — Cloudflare Worker: единая AI-точка (текст + изображения), защита токеном
- sw.js      — service worker: офлайн-резерв и обновления (network-first для навигации)
- manifest.webmanifest, icon.svg — PWA-установка

## Архитектура
Телефон (РФ) → GitHub Pages (index.html)
  → POST/GET https://giga-proxy.dorinvest13.workers.dev (x-app-token: market2026)
      → 1) Cloudflare Workers AI: текст (llama-4-scout → mistral-small-3.1 → qwen3-30b → deepseek-r1-distill)
                                 картинки (flux-1-schnell → stable-diffusion-xl)
      → 2) OpenRouter free-пул (автоподбор по pricing=0 + статический запас) — резерв текста
      → 3) image.pollinations.ai — резерв картинки (часто 404, считается мертвым)

## Контракты Worker API
GET  /?ping=<APP_TOKEN>  → {ok, provider, sample, backend: workers-ai|openrouter, img, wa_log}
POST /  x-app-token:<APP_TOKEN> {prompt, system?, kind?}  → {text, provider, backend}
POST /  x-app-token:<APP_TOKEN> {action:'image', prompt}  → {image: dataURL|url, provider}
Ошибки: 403 (нет токена), 502 (все бэкенды упали; текст ошибки = журнал попыток)

## Ключевые механизмы index.html
- Цех (wizard 01–06): площадка/тема → фото товара (1–3) → AI-арт-директор (LLM возвращает JSON-план:
  bg/headline/badge/variants[layout,scale,ox,oy,rot]) → canvas-рендер N вариантов (превью 460px, экспорт под размер площадки)
- multiply-склейка: если фото товара на белом фоне (авто-детект по средней яркости 24×24 > 225),
  белый становится прозрачным поверх AI-сцены + контактная тень (радиальный градиент)
- Кампания: последовательная генерация текстов под 5 площадок с чип-прогрессом, результаты в историю + localStorage
- A/B-пакеты подачи, переключатель пакетов, пер-ячейковая регенерация фона/ракурса
- История: localStorage aim7-hist (до 30 записей), тизеры 5 шт в обеих вкладках, экспорт JSON
- Экспорт: PNG под размер площадки (TG 1280², Insta 1080×1350, VK 1200², site 1600×900, Dzen 1200×800),
  мини-сайт HTML (текст вперемешку с img), Web Share API (files+text), копирование текста
- Хранение: aim7-* ключи (hist, tpl, ana, th, worker, wtoken, week, camp, wtopic, whead, wbadge)

## Известные ограничения среды (РФ, ноябрь 2026)
- workers.dev блокируется провайдерами РФ → основной вход: custom domain на Cloudflare (ai.dva-ai.ru, зона dva-ai.ru)
- OpenRouter/DeepSeek/GigaChat напрямую из РФ недоступны или требуют ключей; вызовы идут сервер-сервер с эджа Cloudflare
- Pollinations text/image анонимно отключён (404) — оставлен как последний резерв с таймаутом 25 c
- Instagram публикация без Meta API невозможна; Дзен без публичного API — только ручной перенос

## Версии
v8.x — генератор+кампания+карточки+топ; v9.0–9.6 — Цех, multiply, история, аудит-фиксы; v9.7 — финальный аудит (12 фиксов)
</script>

<script>
const log=m=>{document.getElementById('log').textContent+=m+'\n'};
const EMBED={};
document.querySelectorAll('script[type="text/plain"]').forEach(s=>{EMBED[s.dataset.name]=s.textContent.replace(/^\n/,'')});
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(entries){
 const enc=new TextEncoder();const parts=[];const locs=[];let offset=0;
 for(const e of entries){
  const name=enc.encode(e.name),data=e.data,crc=crc32(data);
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);lh.setUint16(8,0,true);
  lh.setUint16(10,0x0821,true);lh.setUint16(12,0x5A85,true);lh.setUint32(14,crc,true);
  lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),name,data);
  locs.push({name,crc,size:data.length,offset});offset+=30+name.length+data.length;
 }
 const cdStart=offset;
 for(const l of locs){
  const name=enc.encode(l.name);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0,true);ch.setUint16(10,0,true);
  ch.setUint16(12,0x0821,true);ch.setUint16(14,0x5A85,true);ch.setUint32(16,l.crc,true);ch.setUint32(20,l.size,true);ch.setUint32(24,l.size,true);
  ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);
  ch.setUint32(38,0,true);ch.setUint32(42,l.offset,true);
  parts.push(new Uint8Array(ch.buffer),name);offset+=46+name.length;
 }
 const eo=new DataView(new ArrayBuffer(22));
 eo.setUint32(0,0x06054b50,true);eo.setUint16(4,0,true);eo.setUint16(6,0,true);
 eo.setUint16(8,locs.length,true);eo.setUint16(10,locs.length,true);
 eo.setUint32(12,offset-cdStart,true);eo.setUint32(16,cdStart,true);eo.setUint16(20,0,true);
 parts.push(new Uint8Array(eo.buffer));
 return new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const escXml=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function docxBlob(text){
 const paras=text.split(/\r?\n/).map(line=>'<w:p><w:r><w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">'+escXml(line)+'</w:t></w:r></w:p>').join('');
 const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+paras+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr></w:body></w:document>';
 const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/><w:sz w:val="16"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>';
 const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
 const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
 const drels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
 const enc=new TextEncoder();
 return zipStore([
  {name:'[Content_Types].xml',data:enc.encode(ct)},
  {name:'_rels/.rels',data:enc.encode(rels)},
  {name:'word/document.xml',data:enc.encode(doc)},
  {name:'word/styles.xml',data:enc.encode(styles)},
  {name:'word/_rels/document.xml.rels',data:enc.encode(drels)}
 ]);
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function grab(f){
 try{const r=await fetch('./'+f,{cache:'no-store'});if(r.ok)return await r.text()}catch(e){}
 if(EMBED[f]){log('ℹ️ '+f+' — встроенная копия');return EMBED[f]}
 throw new Error(f+' → не найден');
}
async function go(f,fmt){try{log('⏳ '+f+'…');const t=await grab(f);
 if(fmt==='docx')save(docxBlob(t),f.replace(/\.[^.]+$/,'')+'.docx');
 else if(fmt==='md')save(new Blob([t],{type:'text/markdown'}),f+'.md');
 else save(new Blob([t],{type:'text/plain'}),f+'.txt');
 log('✅ '+f+' → '+fmt)}catch(e){log('❌ '+e.message)}}
async function goAll(fmt){try{
 log('⏳ собираю весь проект ('+fmt+')…');
 const list=['README.md','worker.js','sw.js','manifest.webmanifest','index.html'];
 let out='',miss=[];
 for(const f of list){try{out+='\n\n========== ФАЙЛ: '+f+' ==========\n\n'+await grab(f)}catch(e){miss.push(f)}}
 if(miss.length)log('⚠️ не найдены: '+miss.join(', '));
 const name='AI-Marketing-PRO-v9.7-full.'+fmt;
 if(fmt==='docx')save(docxBlob(out),name);
 else if(fmt==='md')save(new Blob([out],{type:'text/markdown'}),name);
 else save(new Blob([out],{type:'text/plain'}),name);
 log('✅ '+name+' скачан'+(miss.length?' (без: '+miss.join(', ')+')':' — все 5 файлов внутри'))
}catch(e){log('❌ '+e.message)}}
</script>

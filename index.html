<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-Маркетолог v6.2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4f8;
    color: #1a1a2e;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header .logo { font-size: 32px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header .version {
    background: #0f3460;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: #4ecca3;
  }
  .pro-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #4ecca3;
    margin-top: 2px;
  }
  .pro-badge::before {
    content: '';
    width: 8px; height: 8px;
    background: #4ecca3;
    border-radius: 50%;
    display: inline-block;
  }
  .container { max-width: 700px; margin: 0 auto; padding: 16px; }

  /* Форма ввода */
  .input-section {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .input-section textarea {
    width: 100%;
    border: 2px solid #e0e6ed;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .input-section textarea:focus {
    outline: none;
    border-color: #4ecca3;
  }
  .platforms-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .platform-chip {
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid #e0e6ed;
    background: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .platform-chip.active {
    border-color: #4ecca3;
    background: #e8f8f0;
    color: #1a7a5a;
  }
  .tone-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .tone-chip {
    padding: 6px 14px;
    border-radius: 16px;
    border: 2px solid #e0e6ed;
    background: white;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tone-chip.active {
    border-color: #e94560;
    background: #fde8ec;
    color: #c0392b;
  }
  .generate-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #4ecca3 0%, #38b28a 100%);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .generate-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(78,204,163,0.4); }
  .generate-btn:active { transform: scale(0.98); }
  .generate-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Результаты */
  .results-section { margin-top: 16px; }
  .result-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-left: 4px solid #4ecca3;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .result-card .card-title {
    font-size: 14px;
    font-weight: 700;
    color: #4ecca3;
  }
  .result-card .card-meta {
    font-size: 11px;
    color: #999;
  }
  .result-card .card-text {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .result-card .card-stats {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 12px;
    color: #888;
  }
  .result-card .card-stats span {
    background: #f5f5f5;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .copy-btn {
    background: #4ecca3;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .copy-btn:hover { background: #38b28a; }

  /* Лоадер */
  .loading-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-left: 4px solid #f0ad4e;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid #e0e6ed;
    border-top-color: #4ecca3;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* История */
  .history-section {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .history-header h3 { font-size: 14px; color: #4ecca3; }
  .history-item {
    padding: 12px;
    border: 1px solid #f0f0f0;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-item .h-title { font-weight: 600; color: #4ecca3; }
  .history-item .h-date { font-size: 11px; color: #999; }
  .history-item .h-delete {
    color: #e94560;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
  }

  .error-card {
    border-left-color: #e94560 !important;
  }
  .error-card .card-text { color: #e94560; }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🤖</div>
  <div>
    <h1>ИИ-Маркетолог <span class="version">v6.2</span></h1>
    <div class="pro-badge">PRO АКТИВЕН</div>
  </div>
</div>

<div class="container">

  <!-- Ввод -->
  <div class="input-section">
    <textarea id="userInput" placeholder="Опишите продукт или тему поста...&#10;Например: Джинсы мужские классические, синие, размер 30-36, цена 2990₽"></textarea>

    <div style="margin-top:12px;font-size:13px;font-weight:600;color:#555;">Площадки:</div>
    <div class="platforms-row">
      <div class="platform-chip active" data-platform="vk" onclick="toggleChip(this)">📝 Пост для ВК</div>
      <div class="platform-chip active" data-platform="telegram" onclick="toggleChip(this)">✈️ Пост в Telegram</div>
      <div class="platform-chip active" data-platform="dzen" onclick="toggleChip(this)">📰 Статья для Яндекс Дзен</div>
    </div>

    <div style="margin-top:12px;font-size:13px;font-weight:600;color:#555;">Тон:</div>
    <div class="tone-row">
      <div class="tone-chip active" data-tone="expert" onclick="toggleTone(this)">Экспертный</div>
      <div class="tone-chip" data-tone="friendly" onclick="toggleTone(this)">Дружелюбный</div>
      <div class="tone-chip" data-tone="aggressive" onclick="toggleTone(this)">Агрессивный</div>
      <div class="tone-chip" data-tone="neutral" onclick="toggleTone(this)">Нейтральный</div>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateAll()">
      ⚡ Сгенерировать для всех площадок
    </button>
  </div>

  <!-- Результаты -->
  <div class="results-section" id="resultsSection"></div>

  <!-- История -->
  <div class="history-section">
    <div class="history-header">
      <h3>📋 ИСТОРИЯ</h3>
      <span style="font-size:13px;cursor:pointer;color:#4ecca3;" onclick="clearHistory()">Очистить</span>
    </div>
    <div id="historyList"></div>
  </div>

</div>

<div class="footer">NEURO-МОДУЛЬ · POWERED BY POLLINATIONS</div>

<script>
// ==================== КОНФИГ ====================

const TONE_DESCRIPTIONS = {
  expert: 'экспертный, профессиональный, с фактами и цифрами, уверенный',
  friendly: 'дружелюбный, тёплый, как разговор с другом, с эмодзи',
  aggressive: 'агрессивный продающий, с urgency, дедлайнами, ограниченными предложениями',
  neutral: 'нейтральный, информативный, без эмоциональных окрасок'
};

const PLATFORM_PROMPTS = {
  vk: {
    name: 'Пост для ВК',
    icon: '📝',
    systemPrompt: `Ты — профессиональный SMM-специалист для ВКонтакте.
Правила:
- Пиши ТОЛЬКО готовый пост. НЕ включай текст запроса пользователя в ответ.
- НЕ начинай с фраз типа "Вот ваш пост", "Конечно", "У нас запрос".
- Структура: цепляющий заголовок (1 строка) → боль/проблема клиента → решение (продукт) → 3-4 преимущества → призыв к действию (CTA) → хештеги.
- Длина: 80-150 слов.
- Используй эмодзи умеренно (3-5 штук).
- Добавь 3-5 релевантных хештегов в конце.
- Тон: {tone}.
- Пиши сразу пост, без пояснений.`
  },
  telegram: {
    name: 'Пост в Telegram',
    icon: '✈️',
    systemPrompt: `Ты — опытный Telegram-маркетолог.
Правила:
- Пиши ТОЛЬКО готовый пост. НЕ включай текст запроса пользователя в ответ.
- НЕ начинай с фраз типа "Вот ваш пост", "Конечно".
- Telegram-формат: короткий, ёмкий, с абзацами по 2-3 строки.
- Структура: цепляющая первая строка (жирным) → суть предложения → ключевые выгоды (маркированный список) → CTA с ссылкой-заглушкой [подробнее].
- Длина: 60-120 слов.
- Используй форматирование: **жирный**, _курсив_, моноширинный для цен.
- Тон: {tone}.
- Пиши сразу пост, без пояснений.`
  },
  dzen: {
    name: 'Статья для Яндекс Дзен',
    icon: '📰',
    systemPrompt: `Ты — копирайтер для Яндекс Дзен.
Правила:
- Пиши ТОЛЬКО готовую статью. НЕ включай текст запроса пользователя в ответ.
- НЕ начинай с фраз типа "Вот ваша статья", "Конечно".
- Формат Дзен: цепляющий заголовок (вопрос или интрига) → вступление с болью читателя → основная часть с пользой и фактами → вывод с CTA.
- Длина: 200-350 слов.
- Используй подзаголовки (##), списки, выделения.
- Статья должна быть полезной и информативной, нативно продвигающей продукт.
- Тон: {tone}.
- Пиши сразу статью, без пояснений.`
  }
};

// ==================== UI ====================

function toggleChip(el) {
  el.classList.toggle('active');
}

function toggleTone(el) {
  document.querySelectorAll('.tone-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function getSelectedPlatforms() {
  return [...document.querySelectorAll('.platform-chip.active')]
    .map(el => el.dataset.platform);
}

function getSelectedTone() {
  const active = document.querySelector('.tone-chip.active');
  return active ? active.dataset.tone : 'expert';
}

// ==================== ГЕНЕРАЦИЯ ====================

async function callPollinations(systemPrompt, userMessage) {
  const messages = [
    { role: 'system', content: systemPrompt },
    { role: 'user', content: userMessage }
  ];

  const response = await fetch('https://text.pollinations.ai/openai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'openai',
      messages: messages,
      temperature: 0.7,
      max_tokens: 600
    })
  });

  if (!response.ok) {
    throw new Error(`API ошибка: ${response.status}`);
  }

  const data = await response.json();
  return data.choices?.[0]?.message?.content || data[0]?.text || 'Пустой ответ';
}

async function generateAll() {
  const userInput = document.getElementById('userInput').value.trim();
  if (!userInput) {
    alert('Введите описание продукта или темы!');
    return;
  }

  const platforms = getSelectedPlatforms();
  const tone = getSelectedTone();
  const toneDesc = TONE_DESCRIPTIONS[tone];

  if (platforms.length === 0) {
    alert('Выберите хотя бы одну площадку!');
    return;
  }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Генерация...';

  const resultsSection = document.getElementById('resultsSection');
  resultsSection.innerHTML = '';

  // Показываем лоадеры для каждой площадки
  platforms.forEach(p => {
    const info = PLATFORM_PROMPTS[p];
    resultsSection.innerHTML += `
      <div class="loading-card" id="loading-${p}">
        <div class="spinner"></div>
        <div>
          <div style="font-weight:600;font-size:14px;">${info.icon} ${info.name}</div>
          <div style="font-size:12px;color:#999;">Генерация...</div>
        </div>
      </div>
    `;
  });

  // ОДНОВРЕМЕННАЯ генерация для всех площадок
  const promises = platforms.map(async (platform) => {
    const info = PLATFORM_PROMPTS[platform];
    const systemPrompt = info.systemPrompt.replace('{tone}', toneDesc);

    try {
      const result = await callPollinations(systemPrompt, userInput);
      return { platform, result, error: null };
    } catch (err) {
      return { platform, result: null, error: err.message };
    }
  });

  const results = await Promise.all(promises);

  // Отображаем результаты
  resultsSection.innerHTML = '';
  const now = new Date();
  const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) +
    ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

  results.forEach(({ platform, result, error }) => {
    const info = PLATFORM_PROMPTS[platform];

    if (error) {
      resultsSection.innerHTML += `
        <div class="result-card error-card">
          <div class="card-header">
            <span class="card-title">${info.icon} ${info.name}</span>
            <span class="card-meta">${dateStr}</span>
          </div>
          <div class="card-text">❌ Ошибка: ${error}</div>
        </div>
      `;
      return;
    }

    const words = result.trim().split(/\s+/).length;
    const tokens = Math.ceil(result.length / 4);

    resultsSection.innerHTML += `
      <div class="result-card">
        <div class="card-header">
          <span class="card-title">${info.icon} ${info.name} · Тон: ${toneDesc.split(',')[0]}</span>
          <div style="display:flex;gap:8px;align-items:center;">
            <span class="card-meta">${dateStr}</span>
            <button class="copy-btn" onclick="copyText(this)">📋 Копировать</button>
          </div>
        </div>
        <div class="card-text">${escapeHtml(result)}</div>
        <div class="card-stats">
          <span>📝 Слов: ${words}</span>
          <span>🔤 Токенов: ~${tokens}</span>
        </div>
      </div>
    `;

    // Сохраняем в историю
    saveToHistory(info.name, userInput, dateStr);
  });

  btn.disabled = false;
  btn.textContent = '⚡ Сгенерировать для всех площадок';
}

// ==================== УТИЛИТЫ ====================

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function copyText(btn) {
  const card = btn.closest('.result-card');
  const text = card.querySelector('.card-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Скопировано';
    setTimeout(() => btn.textContent = '📋 Копировать', 2000);
  });
}

function saveToHistory(title, query, date) {
  let history = JSON.parse(localStorage.getItem('marketing_history') || '[]');
  history.unshift({ title, query, date, id: Date.now() });
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem('marketing_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('marketing_history') || '[]');
  const list = document.getElementById('historyList');

  if (history.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#ccc;padding:20px;font-size:13px;">История пуста</div>';
    return;
  }

  list.innerHTML = history.map(item => `
    <div class="history-item">
      <div>
        <div class="h-title">${item.title}</div>
        <div style="font-size:12px;color:#666;margin-top:2px;">${item.query.substring(0, 50)}${item.query.length > 50 ? '...' : ''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="h-date">${item.date}</span>
        <span class="h-delete" onclick="deleteHistoryItem(${item.id})">✕</span>
      </div>
    </div>
  `).join('');
}

function deleteHistoryItem(id) {
  let history = JSON.parse(localStorage.getItem('marketing_history') || '[]');
  history = history.filter(item => item.id !== id);
  localStorage.setItem('marketing_history', JSON.stringify(history));
  renderHistory();
}

function clearHistory() {
  localStorage.removeItem('marketing_history');
  renderHistory();
}

// Инициализация
renderHistory();
</script>

</body>
</html>

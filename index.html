<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<title>ИИ-Маркетолог PRO v9.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Tektur:wght@500;700;800&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--body:'Manrope',sans-serif;--disp:'Tektur',sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
[data-theme=dark]{--bg0:#04070a;--bg1:#0a1014;--ink:#e9f5ef;--muted:#7e8b94;--faint:#55636d;--neon:#2bffa8;--neon-dim:rgba(43,255,168,.12);--vio:#8b5cff;--vio-dim:rgba(139,92,255,.15);--teal:#3ee6c4;--gold:#ffd166;--line:rgba(140,255,205,.13);--line2:rgba(140,255,205,.25);--glass:rgba(14,22,26,.6);--glass2:rgba(14,22,26,.85);--danger:#ff5c7a;--danger-dim:rgba(255,92,122,.1);--warn:#ffb84d;--warn-dim:rgba(255,184,77,.1);--info:#4dc3ff;--info-dim:rgba(77,195,255,.1);--card:linear-gradient(160deg,rgba(255,255,255,.055),rgba(14,22,26,.55) 45%,rgba(139,92,255,.06));--inp:rgba(3,9,11,.6);--sh:0 24px 60px -28px rgba(0,0,0,.8)}
[data-theme=light]{--bg0:#f5f7fa;--bg1:#eef1f5;--ink:#1a2332;--muted:#5a6b7b;--faint:#8494a5;--neon:#00b377;--neon-dim:rgba(0,179,119,.12);--vio:#6d4aff;--vio-dim:rgba(109,74,255,.12);--teal:#00b8a3;--gold:#c99300;--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.15);--glass:rgba(255,255,255,.7);--glass2:rgba(255,255,255,.9);--danger:#e63956;--danger-dim:rgba(230,57,86,.1);--warn:#e69500;--warn-dim:rgba(230,149,0,.1);--info:#0077cc;--info-dim:rgba(0,119,204,.1);--card:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.7) 45%,rgba(109,74,255,.03));--inp:rgba(255,255,255,.85);--sh:0 24px 60px -28px rgba(0,0,0,.15)}
*{margin:0;padding:0;box-sizing:border-box}[hidden]{display:none!important}
html{overscroll-behavior-y:none}
body{font-family:var(--body);color:var(--ink);background:radial-gradient(60% 40% at 85% -5%,rgba(139,92,255,.18),transparent 70%),radial-gradient(70% 45% at 10% 105%,rgba(43,255,168,.12),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg0) 40%);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:0 16px 30px}
.head{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;margin:0 -16px 14px;padding:12px 16px;background:linear-gradient(180deg,var(--glass2),var(--glass));backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.tile{width:50px;height:50px;display:grid;place-items:center;font-size:26px;border-radius:16px;background:linear-gradient(150deg,rgba(43,255,168,.16),rgba(139,92,255,.2));border:1px solid var(--line)}
h1{font-family:var(--disp);font-size:18px}h1 i{color:var(--neon);font-style:normal}
.st{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--neon)}.st i.off{background:var(--danger)}
.ha{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip-v{font-family:var(--disp);font-size:9px;color:var(--teal);border:1px solid rgba(62,230,196,.35);padding:6px 8px;border-radius:8px}
.tgl{width:38px;height:38px;border:1px solid var(--line);background:var(--glass);border-radius:10px;cursor:pointer;font-size:17px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;margin-bottom:16px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font-family:var(--disp);font-size:8.5px;font-weight:700;color:var(--muted);background:none;border:none;border-radius:999px;cursor:pointer}
.tb i{font-size:15px;font-style:normal}.tb.on{color:var(--bg0);background:linear-gradient(120deg,var(--teal),var(--neon))}
.view{animation:vin .4s var(--ease)}.view[hidden]{display:none}
.card{border-radius:18px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:var(--sh);padding:16px;position:relative}
.tag{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-family:var(--disp);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--neon)}.tag u{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);text-decoration:none}
.tag button{font-family:var(--body);font-size:11px;font-weight:700;color:var(--teal);background:none;border:none;cursor:pointer}
.lbl{display:flex;justify-content:space-between;margin:12px 0 6px;font-family:var(--disp);font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
textarea{width:100%;min-height:96px;resize:vertical;padding:13px;border-radius:14px;font-size:15px;background:var(--inp);border:1px solid var(--line);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--neon)}textarea.err{border-color:var(--danger);animation:shk .4s}
.sw{position:relative}select{width:100%;appearance:none;padding:13px 40px 13px 13px;border-radius:14px;font-size:15px;font-weight:600;background:var(--inp);border:1px solid var(--line);color:var(--ink)}
select option{background:var(--bg1)}.sw:after{content:'';position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--neon);border-bottom:2px solid var(--neon);transform:translateY(-70%) rotate(45deg);pointer-events:none}
input[type=text],input[type=password]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--ink);font-size:14px}
input[type=text]:focus{outline:none;border-color:var(--neon)}
.ob{display:flex;gap:6px;flex-wrap:wrap}.ob button{flex:1;min-width:56px;padding:10px 6px;font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.ob button.on{color:var(--bg0);background:linear-gradient(120deg,var(--teal),var(--neon));border-color:transparent}
.fmtgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.fmtbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-weight:800;font-size:12px;cursor:pointer;transition:transform .15s var(--ease),background .2s}
.fmtbtn:active{transform:scale(.96)}
.fmtbtn i{font-size:22px;font-style:normal}
.fmtbtn.on{color:var(--bg0);background:linear-gradient(120deg,var(--teal),var(--neon));border-color:transparent}
.fmtbtn.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px}
.fmtbtn .bdg{position:absolute;top:7px;right:8px;font-size:9px;font-weight:800;background:var(--neon);color:var(--bg0);border-radius:999px;padding:2px 6px}
.fmtbtn.on .bdg{background:var(--bg0);color:var(--neon)}
.hint{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--neon-dim);border-left:3px solid var(--neon);font-size:12px;color:var(--muted);line-height:1.5}
.hint b{color:var(--neon)}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:none;border-radius:16px;font-size:15px;font-weight:800;color:var(--bg0);cursor:pointer;background:linear-gradient(120deg,#7c4dff,var(--teal) 55%,var(--neon));margin-top:12px;overflow:hidden}
.cta:after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sheen 3.5s infinite}
.cta:disabled{opacity:.6;cursor:progress}.cta:disabled:after{animation:none}
.cta2{width:100%;padding:13px;margin-top:8px;border-radius:16px;border:1px solid rgba(139,92,255,.4);background:var(--vio-dim);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer}
.cta2.busy{animation:gradPulse 1.4s ease-in-out infinite;border-color:var(--vio)}
.cta3{width:100%;padding:13px;margin-top:8px;border-radius:16px;border:1px solid var(--info);background:var(--info-dim);color:var(--info);font-weight:800;font-size:14px;cursor:pointer}
.cta4{width:100%;padding:13px;margin-top:8px;border-radius:16px;border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.1);color:var(--gold);font-weight:800;font-size:14px;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(3,9,11,.3);border-radius:18px 18px 0 0;margin:-16px -16px 14px}
.lights{display:flex;gap:5px}.lights i{width:9px;height:9px;border-radius:50%;opacity:.6}.lights i:nth-child(1){background:var(--vio)}.lights i:nth-child(2){background:var(--teal)}.lights i:nth-child(3){background:var(--neon)}
.fn{font-family:var(--disp);font-size:10px;color:var(--faint)}
.ba{margin-left:auto;display:flex;gap:6px}
.bb{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer;text-decoration:none}
.bb:disabled{opacity:.4;cursor:not-allowed}.bb.done{color:var(--neon);border-color:var(--neon)}
.rt{display:flex;gap:6px;margin-bottom:12px}.rt button{flex:1;padding:9px;font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.rt button.on{color:var(--neon);background:var(--neon-dim);border-color:var(--neon)}
.out{font-size:15px;line-height:1.75;white-space:pre-wrap}
.empty{padding:26px 16px;text-align:center;border:1px dashed var(--line2);border-radius:13px;color:var(--faint);font-size:13px}
.ld{padding:24px;text-align:center}.ld .sp{width:32px;height:32px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(139,92,255,.3);border-top-color:var(--neon);animation:spin .8s linear infinite}
.ld p{font-size:13px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2);font-size:11px;font-weight:600;color:var(--faint)}
.meta b{color:var(--muted)}
.schips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.sc{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.sc b{color:var(--neon)}
.sc.wait{animation:chipPulse 1.2s ease-in-out infinite;border-color:var(--info);color:var(--info)}
.sc.doneA{animation:pop .35s var(--ease);border-color:rgba(43,255,168,.5);color:var(--neon)}
.sc.failA{animation:shk .4s;border-color:rgba(255,92,122,.5);color:var(--danger)}
.sc.btn{cursor:pointer;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--muted);font-weight:700}
.sc.btn.on{color:var(--bg0);background:linear-gradient(120deg,var(--teal),var(--neon));border-color:transparent}
.cprog{height:6px;border-radius:3px;background:var(--inp);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.cprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vio),var(--neon));transition:width .5s var(--ease)}
.ebox{margin-top:12px;padding:13px;border-radius:12px;background:var(--danger-dim);border:1px solid rgba(255,92,122,.35);color:#ffb7c3;font-size:13px;line-height:1.5}
.ebox .ea{display:flex;gap:8px;margin-top:10px}.ebox .ea button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--inp);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.ebox .ea .p{background:var(--neon);color:var(--bg0);border-color:var(--neon)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mcell{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--inp);aspect-ratio:1}
.mcell img{width:100%;height:100%;object-fit:cover;display:block}
.mcell .mb{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.mcell .mb button{width:30px;height:30px;border:none;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:13px}
.tplrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.tplrow::-webkit-scrollbar{display:none}
.tpl{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tpl.on{color:var(--bg0);background:linear-gradient(120deg,var(--teal),var(--neon));border-color:transparent}
.wsec{border-top:1px dashed var(--line2);margin-top:14px;padding-top:12px}
.pstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.pstrip::-webkit-scrollbar{display:none}
.pstrip .pc{flex:none;width:86px;height:86px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.pstrip .pc img{width:100%;height:100%;object-fit:cover}
.pstrip .pc button{position:absolute;top:3px;right:3px;width:22px;height:22px;border:none;border-radius:6px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;cursor:pointer}
.pstrip .add{flex:none;width:86px;height:86px;border-radius:12px;border:2px dashed var(--line2);display:grid;place-items:center;font-size:24px;color:var(--muted);cursor:pointer;background:var(--inp)}
.hero{border-radius:22px;padding:2px;background:conic-gradient(from var(--ang),var(--vio),var(--neon),var(--gold),var(--vio));animation:rot 6s linear infinite;margin-bottom:14px}
.hero-in{border-radius:20px;background:var(--glass2);backdrop-filter:blur(20px);padding:18px 16px}
.hero-h{display:flex;align-items:center;gap:10px}
.hero-h .fl{font-size:24px;animation:flame 1.6s ease-in-out infinite}
.hero-h h2{font-family:var(--disp);font-size:15px}
.week-chip{margin-left:auto;font-size:10px;font-weight:800;color:var(--gold);border:1px solid rgba(255,209,102,.4);background:rgba(255,209,102,.08);padding:6px 9px;border-radius:999px;white-space:nowrap}
.hero-sub{font-size:11px;color:var(--muted);margin:4px 0 12px}
.trow{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);margin-top:8px;animation:rin .5s var(--ease) backwards}
.rk{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-size:13px;font-weight:800;background:rgba(255,255,255,.06);color:var(--muted)}
.rk.m0{background:linear-gradient(135deg,#ffd166,#ff9f1c);color:#3a2500}.rk.m1{background:linear-gradient(135deg,#e5e9f0,#a8b3c5);color:#222}.rk.m2{background:linear-gradient(135deg,#e8a87c,#b06e3b);color:#2b1500}
.tinfo{flex:1;min-width:0}.tinfo b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tinfo span{font-size:11px;color:var(--muted)}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:34px;width:62px;flex:none}
.bars i{flex:1;background:linear-gradient(180deg,var(--neon),var(--teal));border-radius:3px;opacity:.9;transition:height .7s var(--ease)}
.bars.big{height:110px;width:100%;gap:6px}.bars.big i{border-radius:6px}
.trnd{flex:none;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px}
.trnd.up{color:var(--neon);background:var(--neon-dim)}.trnd.dn{color:var(--danger);background:var(--danger-dim)}
.dlabels{display:flex;gap:6px;margin-top:6px}.dlabels span{flex:1;text-align:center;font-size:10px;color:var(--faint)}
.scard{margin-top:14px;padding:14px;border-radius:16px;background:var(--inp);border:1px solid var(--line)}
.scard h3{font-size:13px;font-weight:800;margin-bottom:8px}
.posbadge{display:inline-grid;place-items:center;min-width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--vio),var(--neon));color:var(--bg0);font-family:var(--disp);font-weight:800;font-size:16px}
.hteaser{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hteaser::-webkit-scrollbar{display:none}
.ht{flex:none;width:150px;padding:11px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer}
.ht .i{font-size:20px}
.ht .t{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ht .d{font-size:9px;color:var(--faint);margin-top:5px}
.hl{display:flex;flex-direction:column;gap:9px;max-height:360px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin;margin-top:10px}
.hl::-webkit-scrollbar{width:6px}.hl::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.hi{padding:13px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;position:relative;flex:none}
.hi .h1{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--neon);margin-bottom:5px}
.hi .h1 span{color:var(--faint);font-weight:500;font-size:10px}
.hi .h2{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hi .hd{position:absolute;top:9px;right:9px;width:22px;height:22px;border:none;border-radius:6px;background:var(--danger-dim);color:var(--danger);cursor:pointer;font-size:11px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dz{position:relative;border:2px dashed var(--line2);border-radius:14px;background:var(--inp);padding:16px 8px;text-align:center;cursor:pointer}
.dz.has{padding:0;border-style:solid;border-color:rgba(43,255,168,.5)}
.dz .di{font-size:28px}.dz .dt{font-size:12px;font-weight:700;color:var(--muted);margin-top:5px}.dz .dh{font-size:10px;color:var(--faint)}
.dz img{width:100%;height:105px;object-fit:cover;border-radius:12px;display:block}
.dz .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.dz input{display:none}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}.row label{flex:none;width:84px;font-size:11px;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--neon)}
canvas#cv{width:100%;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:#0a1014;display:block;margin-top:12px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc{padding:14px;border-radius:14px;background:var(--inp);border:1px solid var(--line)}
.dc .v{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--neon)}
.dc .l{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.da{display:flex;flex-direction:column;gap:9px}
.db{display:flex;gap:12px;align-items:center;padding:13px;border-radius:12px;background:var(--inp);border:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:700;text-align:left;color:var(--ink)}
.db.danger{color:var(--danger)}
.tr2{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--inp);border:1px solid var(--line);font-size:13px;font-weight:600;margin-top:6px}
.tr2.pass{border-color:rgba(43,255,168,.3)}.tr2.fail{border-color:rgba(255,92,122,.4)}
.tr2 .ts{margin-left:auto;font-weight:800;font-size:12px}.tr2.pass .ts{color:var(--neon)}.tr2.fail .ts{color:var(--danger)}
.ti{display:flex;gap:10px;align-items:center;padding:11px;border-radius:10px;background:var(--inp);border:1px solid var(--line);margin-top:8px}
.ti span{flex:1;font-size:13px}.ti button{background:none;border:none;cursor:pointer;font-size:14px;width:26px;height:26px;border-radius:8px}

.pv-tg div{background:#1c92d2;color:#fff;border-radius:12px 12px 12px 4px;padding:11px;font-size:14px;line-height:1.5}
